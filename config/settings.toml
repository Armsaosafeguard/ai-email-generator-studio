[studio]
name = "ai-email-generator-studio"
version = "0.6.2"
theme = "carbon"
autosave_seconds = 20

[generator]
default_provider = "openai_provider"
default_tone = "professional-warm"
max_tokens = 900
temperature = 0.7
retry_attempts = 3

[paths]
plugin_dirs = ["plugins/providers", "plugins/tones", "plugins/exporters"]
template_dir = "templates"
output_dir = "generated_emails"
log_dir = "logs"

[ui]
start_view = "compose"
show_token_meter = true
confirm_on_overwrite = true